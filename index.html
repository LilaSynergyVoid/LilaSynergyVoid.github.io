<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STM32 Last-Layer Abstract Art</title>
  <style>
    :root {
      --hue-a: 210;
      --hue-b: 320;
      --chaos: 0.3;
      --scale: 1;
      --speed: 14s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #090b10;
      color: #eef2ff;
      font-family: system-ui, -apple-system, sans-serif;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      width: 62vmin;
      height: 62vmin;
      border-radius: calc(28% + var(--chaos) * 35%) calc(64% - var(--chaos) * 25%);
      background: radial-gradient(
        circle at 30% 30%,
        hsla(var(--hue-a), 85%, 60%, 0.78),
        hsla(var(--hue-b), 80%, 48%, 0.35) 60%,
        transparent 75%
      );
      filter: blur(calc(6px + var(--chaos) * 28px));
      transform: scale(var(--scale)) rotate(calc(var(--chaos) * 180deg));
      transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      animation: drift var(--speed) ease-in-out infinite alternate;
    }

    @keyframes drift {
      0%   { transform: translate(-6%, -4%) scale(var(--scale)) rotate(0deg); }
      100% { transform: translate(6%, 5%) scale(calc(var(--scale) * 1.08)) rotate(calc(var(--chaos) * 90deg)); }
    }

    .hud {
      position: relative;
      z-index: 2;
      padding: 0.9rem 1.25rem;
      background: rgba(12, 16, 26, 0.78);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="stage" id="stage"></main>
  <footer class="hud">
    <div id="poem-display">Poem: —</div>
    <div id="meta-display">Frames: 0 | Branch: main</div>
  </footer>

  <script>
    async function renderArt() {
      try {
        const res = await fetch("./data/history.json?t=" + Date.now());
        if (!res.ok) return;
        const history = await res.json();
        if (!Array.isArray(history) || history.length === 0) return;

        const latest = history[history.length - 1];
        const vec = Array.isArray(latest.last_layer) ? latest.last_layer : [0.2, 0.5, 0.8];
        const root = document.documentElement.style;

        const hueA = Math.abs(Math.round((vec[0] || 0.2) * 360)) % 360;
        const hueB = (hueA + 110 + Math.abs(Math.round((vec[1] || 0.5) * 140))) % 360;
        const chaos = Math.min(1, Math.max(0.05, Number(latest.rnd ?? 0.3)));
        const scale = 0.75 + Math.min(0.75, Math.abs(Number(vec[2] ?? 0.4)));

        root.setProperty("--hue-a", hueA);
        root.setProperty("--hue-b", hueB);
        root.setProperty("--chaos", chaos);
        root.setProperty("--scale", scale);

        const stage = document.getElementById("stage");
        stage.innerHTML = "";
        const slices = history.slice(-6);
        slices.forEach((frame, idx) => {
          const v = Array.isArray(frame.last_layer) ? frame.last_layer : vec;
          const el = document.createElement("div");
          el.className = "layer";
          el.style.setProperty("--hue-a", (hueA + idx * 28) % 360);
          el.style.setProperty("--hue-b", (hueB + idx * 42) % 360);
          el.style.setProperty("--chaos", Math.min(1, Math.abs(v[idx % v.length] || chaos)));
          el.style.setProperty("--scale", (0.55 + idx * 0.1).toFixed(2));
          stage.appendChild(el);
        });

        document.getElementById("poem-display").textContent = `Poem: "${latest.poem || ""}"`;
        document.getElementById("meta-display").textContent =
          `Frames: ${history.length} | Branch: ${latest.branch || "main"} | Remelt: ${latest.remelt ? "ON" : "OFF"}`;
      } catch (err) {
        console.error(err);
      }
    }

    renderArt();
    setInterval(renderArt, 15000);
  </script>
</body>
</html>
